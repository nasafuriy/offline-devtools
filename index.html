<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Shashka — Offline Developer Toolbox</title>
<meta name="description" content="23 developer tools in a single HTML file. Works offline, no install, no tracking, nothing leaves your browser.">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Cpath d='M9 22l6-12M17 22l6-12M8 16h16' stroke='%2360d0ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Link previews. Absolute URLs, because scrapers do not resolve relative ones. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shashka">
<meta property="og:title" content="Shashka — 23 developer tools in a single HTML file">
<meta property="og:description" content="Format JSON, decode a JWT, hash a file, build a QR code, test a regex. Everything runs inside the page — no server, no account, no telemetry.">
<meta property="og:url" content="https://nasafuriy.github.io/offline-devtools/">
<meta property="og:image" content="https://nasafuriy.github.io/offline-devtools/docs/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shashka — 23 developer tools in a single HTML file">
<meta name="twitter:description" content="Works offline, no install, no tracking, nothing leaves your browser.">
<meta name="twitter:image" content="https://nasafuriy.github.io/offline-devtools/docs/social-preview.png">

<!-- pwa:start — stripped from the single-file build, which has no sibling files -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="docs/icon-192.png">
<!-- pwa:end -->

<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<div id="app" class="app">

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>

    <a class="brand" href="#/" aria-label="Shashka home">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="url(#bg)"/>
        <path d="M9 22l6-12M17 22l6-12M8 16h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".95"/>
        <defs><linearGradient id="bg" x1="0" y1="0" x2="32" y2="32">
          <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient></defs>
      </svg>
      <span class="brand-text">Shashka</span>
    </a>

    <button class="search-trigger" id="searchTrigger">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="searchTools">Search tools</span>
      <kbd class="kbd-hint">Ctrl K</kbd>
    </button>

    <div class="topbar-right">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="uz">UZ</button>
        <button data-lang="ru">RU</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.2A8.2 8.2 0 019.8 4a8.5 8.5 0 102 10.2 8.2 8.2 0 008.2 0z" fill="currentColor"/></svg>
      </button>
      <a class="icon-btn" id="repoBtn" href="https://github.com/nasafuriy/offline-devtools" target="_blank" rel="noopener" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 .5a11.5 11.5 0 00-3.64 22.42c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.06-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.75.4-1.27.73-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.5 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0012 .5z"/></svg>
      </a>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav class="tool-nav" id="toolNav"></nav>
    <footer class="side-foot">
      <div class="side-foot-line"><span data-i18n="offlineBadge">100% offline</span> · <span id="toolCount">0</span> <span data-i18n="toolsWord">tools</span></div>
      <div class="side-foot-line dim" data-i18n="noNetwork">No request ever leaves this page.</div>
    </footer>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div id="toolHost"></div>
  </main>

</div>

<!-- Command palette -->
<div class="palette-wrap" id="palette" hidden>
  <div class="palette">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search tools…">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="toaster" id="toaster"></div>

<!-- Core -->
<script src="src/lib/util.js"></script>
<script src="src/lib/md5.js"></script>
<script src="src/lib/qrcode.js"></script>
<script src="src/lib/diff.js"></script>
<script src="src/lib/markdown.js"></script>
<script src="src/core.js"></script>

<!-- Tools -->
<script src="src/tools/json.js"></script>
<script src="src/tools/jsonconvert.js"></script>
<script src="src/tools/csv.js"></script>
<script src="src/tools/base64.js"></script>
<script src="src/tools/url.js"></script>
<script src="src/tools/escape.js"></script>
<script src="src/tools/number.js"></script>
<script src="src/tools/hash.js"></script>
<script src="src/tools/jwt.js"></script>
<script src="src/tools/uuid.js"></script>
<script src="src/tools/password.js"></script>
<script src="src/tools/time.js"></script>
<script src="src/tools/cron.js"></script>
<script src="src/tools/regex.js"></script>
<script src="src/tools/case.js"></script>
<script src="src/tools/textkit.js"></script>
<script src="src/tools/diff.js"></script>
<script src="src/tools/markdown.js"></script>
<script src="src/tools/lorem.js"></script>
<script src="src/tools/color.js"></script>
<script src="src/tools/qr.js"></script>
<script src="src/tools/image.js"></script>
<script src="src/tools/cheatsheet.js"></script>

<script>DevBox.start();</script>

<!-- pwa:start -->
<script>
// Registering the worker is what makes the hosted copy installable and fully
// offline. It is skipped entirely off HTTPS, so file:// stays untouched.
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* not hosted here */ });
  });
}
</script>
<!-- pwa:end -->
</body>
</html>
