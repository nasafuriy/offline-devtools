/* JSON → TypeScript / Go / Python / JSON Schema type generation. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  DevBox.register({
    id: 'jsonconvert',
    icon: '⇄',
    category: 'data',
    keywords: 'json typescript interface go struct python dataclass schema types generate',
    name: { en: 'JSON to Types', uz: 'JSON’dan tiplar', ru: 'JSON в типы' },
    desc: {
      en: 'Turn a sample JSON payload into TypeScript interfaces, Go structs, Python dataclasses or a JSON Schema.',
      uz: 'Namunaviy JSON’dan TypeScript interfeys, Go struct, Python dataclass yoki JSON Schema hosil qiling.',
      ru: 'Превратите пример JSON в интерфейсы TypeScript, структуры Go, dataclass Python или JSON Schema.'
    },

    mount: function (root, ctx) {
      var SAMPLE = '{\n  "id": 42,\n  "name": "Ada",\n  "active": true,\n  "score": 9.5,\n  "tags": ["math", "code"],\n  "address": { "city": "London", "zip": null }\n}';

      var input = ui.textarea({ tall: true, value: ctx.store.get('input', SAMPLE) });
      var rootName = ui.input({ value: ctx.store.get('rootName', 'Root'), placeholder: 'Root type name' });
      var target = ui.select({
        options: [['ts', 'TypeScript'], ['go', 'Go'], ['py', 'Python'], ['schema', 'JSON Schema']],
        value: ctx.store.get('target', 'ts')
      });
      var out = ui.output({ title: 'Generated types', download: function () { return 'types' + EXT[target.value]; } });

      var EXT = { ts: '.ts', go: '.go', py: '.py', schema: '.schema.json' };

      function run() {
        ctx.store.set('input', input.value.slice(0, 100000));
        ctx.store.set('target', target.value);
        ctx.store.set('rootName', rootName.value);

        var text = input.value.trim();
        if (!text) return out.set('');

        var data;
        try { data = JSON.parse(text); }
        catch (err) { return out.set('Invalid JSON: ' + err.message, 'err'); }

        var name = pascal(rootName.value || 'Root');
        try {
          var type = infer(data);
          if (target.value === 'ts') out.set(emitTs(type, name));
          else if (target.value === 'go') out.set(emitGo(type, name));
          else if (target.value === 'py') out.set(emitPy(type, name));
          else out.set(JSON.stringify(emitSchema(type), null, 2));
        } catch (err) {
          out.set('Could not generate types: ' + err.message, 'err');
        }
      }

      root.appendChild(ui.card('Sample JSON', input));
      root.appendChild(h('div.row', target, rootName, ui.btn('Generate', run, 'primary')));
      root.appendChild(out);

      input.addEventListener('input', ui.debounce(run, 350));
      target.addEventListener('change', run);
      rootName.control.addEventListener('input', ui.debounce(run, 350));
      run();
    }
  });

  /* ---------------------------------------------------------- inference */

  // A type is {kind, fields?, required?, items?, nullable?}
  function infer(value) {
    if (value === null) return { kind: 'null', nullable: true };
    if (Array.isArray(value)) {
      if (!value.length) return { kind: 'array', items: { kind: 'any' } };
      return { kind: 'array', items: value.map(infer).reduce(merge) };
    }
    if (typeof value === 'object') {
      var fields = {};
      Object.keys(value).forEach(function (key) { fields[key] = infer(value[key]); });
      return { kind: 'object', fields: fields, required: Object.keys(value) };
    }
    if (typeof value === 'number') return { kind: Number.isInteger(value) ? 'integer' : 'number' };
    if (typeof value === 'boolean') return { kind: 'boolean' };
    return { kind: 'string' };
  }

  /** Unifies the element types seen across an array. */
  function merge(a, b) {
    if (a.kind === 'null') return Object.assign({}, b, { nullable: true });
    if (b.kind === 'null') return Object.assign({}, a, { nullable: true });
    if (a.kind === 'integer' && b.kind === 'number') return { kind: 'number', nullable: a.nullable || b.nullable };
    if (a.kind === 'number' && b.kind === 'integer') return { kind: 'number', nullable: a.nullable || b.nullable };
    if (a.kind !== b.kind) return { kind: 'any', nullable: a.nullable || b.nullable };

    if (a.kind === 'array') return { kind: 'array', items: merge(a.items, b.items), nullable: a.nullable || b.nullable };

    if (a.kind === 'object') {
      var fields = {};
      var keys = Object.keys(a.fields).concat(Object.keys(b.fields).filter(function (k) { return !(k in a.fields); }));
      keys.forEach(function (key) {
        if (key in a.fields && key in b.fields) fields[key] = merge(a.fields[key], b.fields[key]);
        else fields[key] = a.fields[key] || b.fields[key];
      });
      var required = (a.required || []).filter(function (k) { return (b.required || []).indexOf(k) >= 0; });
      return { kind: 'object', fields: fields, required: required, nullable: a.nullable || b.nullable };
    }
    return { kind: a.kind, nullable: a.nullable || b.nullable };
  }

  /* ---------------------------------------------------------- naming */

  function pascal(name) {
    return String(name).replace(/[^A-Za-z0-9]+(.)?/g, function (_, c) { return c ? c.toUpperCase() : ''; })
      .replace(/^[a-z]/, function (c) { return c.toUpperCase(); }) || 'Root';
  }

  function singular(name) {
    if (/ies$/i.test(name)) return name.slice(0, -3) + 'y';
    if (/(s|ch|sh|x|z)es$/i.test(name)) return name.slice(0, -2);
    if (/[^s]s$/i.test(name)) return name.slice(0, -1);
    return name;
  }

  var INITIALISMS = ['ID', 'URL', 'URI', 'API', 'HTTP', 'HTTPS', 'JSON', 'XML', 'HTML', 'SQL', 'UUID', 'IP', 'DB', 'TTL', 'CPU', 'OS'];

  function goName(key) {
    return String(key).split(/[^A-Za-z0-9]+/).filter(Boolean).map(function (part) {
      var upper = part.toUpperCase();
      if (INITIALISMS.indexOf(upper) >= 0) return upper;
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join('') || 'Field';
  }

  function isSafeIdent(key) { return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(key); }

  /**
   * Walks the type tree and assigns a unique name to every nested object,
   * returning them in definition order (children before parents).
   */
  function collect(type, name, seen, order) {
    if (type.kind === 'object') {
      var unique = name, n = 2;
      while (seen.has(unique) && seen.get(unique) !== type) unique = name + n++;
      if (!seen.has(unique)) {
        seen.set(unique, type);
        type.__name = unique;
        Object.keys(type.fields).forEach(function (key) {
          collect(type.fields[key], pascal(singular(key)), seen, order);
        });
        order.push({ name: unique, type: type });
      }
    } else if (type.kind === 'array') {
      collect(type.items, name, seen, order);
    }
    return order;
  }

  /* ---------------------------------------------------------- emitters */

  function emitTs(type, rootName) {
    var defs = collect(type, rootName, new Map(), []);
    if (!defs.length) return 'export type ' + rootName + ' = ' + tsType(type) + ';';

    return defs.map(function (def) {
      var lines = Object.keys(def.type.fields).map(function (key) {
        var field = def.type.fields[key];
        var optional = (def.type.required || []).indexOf(key) < 0;
        var label = isSafeIdent(key) ? key : JSON.stringify(key);
        return '  ' + label + (optional ? '?' : '') + ': ' + tsType(field) + ';';
      });
      return 'export interface ' + def.name + ' {\n' + lines.join('\n') + '\n}';
    }).join('\n\n');
  }

  function tsType(type) {
    var base;
    switch (type.kind) {
      case 'object': base = type.__name || 'Record<string, unknown>'; break;
      case 'array': base = tsType(type.items); base = /[|&]/.test(base) ? '(' + base + ')[]' : base + '[]'; break;
      case 'integer': case 'number': base = 'number'; break;
      case 'boolean': base = 'boolean'; break;
      case 'string': base = 'string'; break;
      case 'null': return 'null';
      default: base = 'unknown';
    }
    return type.nullable ? base + ' | null' : base;
  }

  function emitGo(type, rootName) {
    var defs = collect(type, rootName, new Map(), []);
    if (!defs.length) return 'type ' + rootName + ' ' + goType(type);

    return defs.slice().reverse().map(function (def) {
      var rows = Object.keys(def.type.fields).map(function (key) {
        return [goName(key), goType(def.type.fields[key]), '`json:"' + key +
          ((def.type.required || []).indexOf(key) < 0 ? ',omitempty' : '') + '"`'];
      });
      var w0 = Math.max.apply(null, rows.map(function (r) { return r[0].length; }).concat([1]));
      var w1 = Math.max.apply(null, rows.map(function (r) { return r[1].length; }).concat([1]));
      var body = rows.map(function (r) {
        return '\t' + r[0].padEnd(w0) + ' ' + r[1].padEnd(w1) + ' ' + r[2];
      }).join('\n');
      return 'type ' + def.name + ' struct {\n' + body + '\n}';
    }).join('\n\n');
  }

  function goType(type) {
    var base;
    switch (type.kind) {
      case 'object': base = type.__name || 'map[string]interface{}'; break;
      case 'array': return '[]' + goType(type.items);
      case 'integer': base = 'int64'; break;
      case 'number': base = 'float64'; break;
      case 'boolean': base = 'bool'; break;
      case 'string': base = 'string'; break;
      case 'null': return 'interface{}';
      default: return 'interface{}';
    }
    return type.nullable ? '*' + base : base;
  }

  function emitPy(type, rootName) {
    var defs = collect(type, rootName, new Map(), []);
    var head = 'from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Any, Optional\n\n';
    if (!defs.length) return head + rootName + ' = ' + pyType(type);

    // `collect` already returns children before parents, which is the order
    // Python needs for the annotations to resolve.
    return head + defs.map(function (def) {
      var body = Object.keys(def.type.fields).map(function (key) {
        var field = def.type.fields[key];
        var optional = (def.type.required || []).indexOf(key) < 0;
        var t = pyType(field);
        return '    ' + pySafe(key) + ': ' + (optional ? 'Optional[' + t + '] = None' : t);
      }).join('\n');
      return '@dataclass\nclass ' + def.name + ':\n' + (body || '    pass');
    }).join('\n\n\n');
  }

  function pyType(type) {
    var base;
    switch (type.kind) {
      case 'object': base = type.__name || 'dict[str, Any]'; break;
      case 'array': base = 'list[' + pyType(type.items) + ']'; break;
      case 'integer': base = 'int'; break;
      case 'number': base = 'float'; break;
      case 'boolean': base = 'bool'; break;
      case 'string': base = 'str'; break;
      case 'null': return 'None';
      default: base = 'Any';
    }
    return type.nullable ? 'Optional[' + base + ']' : base;
  }

  var PY_KEYWORDS = ['class', 'def', 'from', 'import', 'return', 'lambda', 'global', 'pass', 'None', 'True', 'False', 'in', 'is', 'not', 'or', 'and', 'if', 'else', 'for', 'while', 'try', 'except'];

  function pySafe(key) {
    var name = String(key).replace(/[^A-Za-z0-9_]/g, '_').replace(/^(\d)/, '_$1');
    return PY_KEYWORDS.indexOf(name) >= 0 ? name + '_' : (name || 'field');
  }

  function emitSchema(type) {
    var schema = schemaFor(type);
    schema.$schema = 'http://json-schema.org/draft-07/schema#';
    return schema;
  }

  function schemaFor(type) {
    var node = {};
    switch (type.kind) {
      case 'object':
        node.type = 'object';
        node.properties = {};
        Object.keys(type.fields).forEach(function (key) { node.properties[key] = schemaFor(type.fields[key]); });
        if ((type.required || []).length) node.required = type.required.slice();
        break;
      case 'array':
        node.type = 'array';
        node.items = schemaFor(type.items);
        break;
      case 'any': break;
      case 'null': node.type = 'null'; break;
      default: node.type = type.kind;
    }
    if (type.nullable && node.type && node.type !== 'null') node.type = [node.type, 'null'];
    return node;
  }
})();

      function run() {
        ctx.store.set('dir', direction.value);
        ctx.store.set('delim', delimiter.value);
        ctx.store.set('header', hasHeader.checked);
        ctx.store.set('input', input.value.slice(0, 200000));

        var text = input.value.trim();
        ui.clear(info);
        if (!text) { out.set(''); ui.clear(preview); return; }

        try {
          if (direction.value === 'c2j') csvToJson(text);
          else jsonToCsv(text);
        } catch (err) {
          out.set(err.message, 'err');
          ui.clear(preview);
        }
      }

      function csvToJson(text) {
        var delim = delimiter.value === 'auto' ? detectDelimiter(text) : delimiter.value;
        var rows = parseCsv(text, delim);
        if (!rows.length) { out.set('[]'); ui.clear(preview); return; }

        var header, records;
        if (hasHeader.checked) {
          header = dedupe(rows[0]);
          records = rows.slice(1).map(function (row) {
            var obj = {};
            header.forEach(function (key, i) { obj[key] = coerce(row[i] === undefined ? '' : row[i]); });
            return obj;
          });
        } else {
          header = rows[0].map(function (_, i) { return 'col' + (i + 1); });
          records = rows.map(function (row) { return row.map(coerce); });
        }

        out.set(JSON.stringify(records, null, 2));
        info.appendChild(h('div.stat-row',
          ui.stat(ui.num(records.length), 'rows'),
          ui.stat(header.length, 'columns'),
          ui.stat(JSON.stringify(delim).replace(/"/g, '') || ',', 'delimiter')
        ));
        drawPreview(header, rows.slice(hasHeader.checked ? 1 : 0));
      }

      function jsonToCsv(text) {
        var data = JSON.parse(text);
        if (!Array.isArray(data)) data = [data];
        if (!data.length) { out.set(''); ui.clear(preview); return; }

        var delim = delimiter.value === 'auto' ? ',' : delimiter.value;
        var header = [];
        data.forEach(function (row) {
          if (row && typeof row === 'object' && !Array.isArray(row)) {
            Object.keys(row).forEach(function (key) { if (header.indexOf(key) < 0) header.push(key); });
          }
        });

        var lines = [];
        var body = data.map(function (row) {
          if (Array.isArray(row)) return row.map(cell);
          if (row && typeof row === 'object') return header.map(function (key) { return cell(row[key]); });
          return [cell(row)];
        });

        if (header.length && hasHeader.checked) lines.push(header.map(cell).join(delim));
        body.forEach(function (row) { lines.push(row.join(delim)); });

        out.set(lines.join('\n'));
        info.appendChild(h('div.stat-row',
          ui.stat(ui.num(body.length), 'rows'),
          ui.stat(header.length || (body[0] || []).length, 'columns')
        ));
        drawPreview(header.length ? header : (body[0] || []).map(function (_, i) { return 'col' + (i + 1); }),
          body.map(function (row) { return row.map(unquote); }));

        function cell(value) {
          if (value === null || value === undefined) return '';
          var s = typeof value === 'object' ? JSON.stringify(value) : String(value);
          return (s.indexOf(delim) >= 0 || /["\n\r]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }
      }

      function drawPreview(header, rows) {
        ui.clear(preview);
        var table = h('table.tbl');
        table.appendChild(h('thead', h('tr', header.map(function (key) { return h('th', { text: key }); }))));
        var tbody = h('tbody');
        rows.slice(0, 200).forEach(function (row) {
          tbody.appendChild(h('tr', header.map(function (_, i) {
            return h('td.mono', { text: row[i] === undefined ? '' : String(row[i]) });
          })));
        });
        table.appendChild(tbody);
        preview.appendChild(table);
        if (rows.length > 200) preview.appendChild(h('div.note', { style: { padding: '8px 10px' }, text: 'Showing the first 200 of ' + ui.num(rows.length) + ' rows.' }));
      }

      root.appendChild(h('div.row', direction, delimiter, hasHeader));
      root.appendChild(ui.card('Input', input));
      root.appendChild(info);
      root.appendChild(out);
      root.appendChild(previewCard);

      input.addEventListener('input', ui.debounce(run, 300));
      direction.addEventListener('change', run);
      delimiter.addEventListener('change', run);
      run();
    }
  });

  /* ---------------------------------------------------------- parsing */

  /** RFC 4180 parser: honours quoted fields, doubled quotes and embedded newlines. */
  function parseCsv(text, delim) {
    var rows = [], row = [], field = '', quoted = false, started = false, i = 0;

    while (i < text.length) {
      var c = text[i];

      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          quoted = false; i++; continue;
        }
        field += c; i++;
        continue;
      }

      if (c === '"' && !started) { quoted = true; started = true; i++; continue; }
      if (c === delim) { row.push(field); field = ''; started = false; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; started = false; i++; continue; }
      field += c; started = true; i++;
    }

    if (field !== '' || row.length || started) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || (r[0] || '').trim() !== ''; });
  }

  function detectDelimiter(text) {
    var firstLine = text.split(/\r?\n/)[0] || '';
    var best = ',', bestCount = 0;
    [',', ';', '\t', '|'].forEach(function (d) {
      var count = 0, quoted = false;
      for (var i = 0; i < firstLine.length; i++) {
        if (firstLine[i] === '"') quoted = !quoted;
        else if (firstLine[i] === d && !quoted) count++;
      }
      if (count > bestCount) { bestCount = count; best = d; }
    });
    return best;
  }

  /** Numbers and booleans become real JSON values; everything else stays a string. */
  function coerce(value) {
    var s = String(value).trim();
    if (s === '') return '';
    if (s === 'true') return true;
    if (s === 'false') return false;
    if (s === 'null') return null;
    // Only convert when the round trip is lossless, so IDs like 007 survive.
    if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s) && String(Number(s)) === s) return Number(s);
    return String(value);
  }

  function dedupe(keys) {
    var seen = {};
    return keys.map(function (key, i) {
      var name = String(key).trim() || 'col' + (i + 1);
      if (seen[name] === undefined) { seen[name] = 1; return name; }
      return name + '_' + (++seen[name]);
    });
  }

  function unquote(s) {
    return /^".*"$/.test(s) ? s.slice(1, -1).replace(/""/g, '"') : s;
  }
})();

/* ===== src/tools/base64.js ===== */
/* Base64 for text and files, including data URIs. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  DevBox.register({
    id: 'base64',
    icon: '64',
    category: 'data',
    keywords: 'base64 encode decode data uri file binary atob btoa url safe',
    name: { en: 'Base64', uz: 'Base64', ru: 'Base64' },
    desc: {
      en: 'Encode and decode Base64 — UTF-8 text, URL-safe variants, and files turned into data URIs.',
      uz: 'Base64 kodlash va dekodlash — UTF-8 matn, URL uchun xavfsiz koʻrinish va fayllardan data URI.',
      ru: 'Кодирование и декодирование Base64: текст UTF-8, URL-safe вариант и файлы в виде data URI.'
    },

    mount: function (root, ctx) {
      /* ------------------------------------------------ text */

      var urlSafe = ui.checkbox('URL-safe alphabet (-_ instead of +/)', ctx.store.get('urlSafe', false), sync);
      var plain = ui.textarea({ placeholder: 'Plain text', value: ctx.store.get('plain', '') });
      var encoded = ui.textarea({ placeholder: 'Base64' });
      var note = h('div');

      function encode() {
        ui.clear(note);
        try {
          var b64 = ui.b64Encode(ui.utf8Bytes(plain.value));
          encoded.value = urlSafe.checked ? ui.b64ToB64Url(b64) : b64;
          ctx.store.set('plain', plain.value.slice(0, 50000));
        } catch (err) {
          note.appendChild(ui.banner('err', err.message));
        }
      }

      function decode() {
        ui.clear(note);
        var text = encoded.value.trim();
        if (!text) { plain.value = ''; return; }
        try {
          var bytes = ui.b64Decode(ui.b64UrlToB64(text));
          plain.value = ui.bytesToUtf8(bytes);
          note.appendChild(ui.banner('ok', 'Decoded ' + ui.bytes(bytes.length) + ' of data.'));
        } catch (err) {
          note.appendChild(ui.banner('err', 'Not valid Base64: ' + err.message));
        }
      }

      function sync() {
        ctx.store.set('urlSafe', urlSafe.checked);
        if (plain.value) encode();
      }

      var textCard = ui.card('Text');
      textCard.body.appendChild(h('div.grid2',
        h('div', h('label.lbl', { text: 'PLAIN TEXT' }), plain),
        h('div', h('label.lbl', { text: 'BASE64' }), encoded)
      ));
      textCard.body.appendChild(h('div.row.mt12',
        ui.btn('Encode ↓', encode, 'primary'),
        ui.btn('Decode ↑', decode),
        urlSafe,
        h('div.spacer'),
        ui.btn('Copy Base64', function () { ui.copy(encoded.value); }, 'ghost'),
        ui.btn('Copy text', function () { ui.copy(plain.value); }, 'ghost'),
        ui.btn('Swap', function () {
          var tmp = plain.value; plain.value = encoded.value; encoded.value = tmp;
        }, 'ghost')
      ));
      textCard.body.appendChild(note);

      /* ------------------------------------------------ files */

      var fileOut = ui.output({ title: 'File as Base64', download: 'encoded.txt' });
      var fileInfo = h('div');
      var lastFile = null;

      function readFile(file) {
        lastFile = file;
        var reader = new FileReader();
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var b64 = ui.b64Encode(bytes);
          var mime = file.type || 'application/octet-stream';
          fileOut.set(asDataUri.checked ? 'data:' + mime + ';base64,' + b64 : b64);
          ui.clear(fileInfo).appendChild(h('div.stat-row',
            ui.stat(ui.bytes(file.size), 'file size'),
            ui.stat(ui.bytes(b64.length), 'base64 size'),
            ui.stat(mime.split('/')[1] || mime, 'type')
          ));
        };
        reader.onerror = function () { fileOut.set('Could not read that file.', 'err'); };
        reader.readAsArrayBuffer(file);
      }

      var zone = ui.dropzone('Drop a file here, or click to choose — it is read locally and never uploaded', readFile);

      var asDataUri = ui.checkbox('Wrap as a data: URI', ctx.store.get('dataUri', true), function () {
        ctx.store.set('dataUri', asDataUri.checked);
        if (lastFile) readFile(lastFile);
      });

      var fileCard = ui.card('File → Base64', zone, h('div.row.mt12', asDataUri), fileInfo);

      /* ------------------------------------------------ data URI back to a file */

      var uriInput = ui.textarea({ short: true, placeholder: 'data:image/png;base64,iVBORw0…' });
      var uriPreview = h('div');

      var decodeCard = ui.card('Data URI → file',
        uriInput,
        h('div.row.mt12',
          ui.btn('Save as file', function () {
            try {
              var parsed = parseDataUri(uriInput.value.trim());
              ui.download(suggestName(parsed.mime), new Blob([parsed.bytes], { type: parsed.mime }));
            } catch (err) { ui.toast(err.message, 'err'); }
          }, 'primary'),
          ui.btn('Preview image', function () {
            ui.clear(uriPreview);
            try {
              var parsed = parseDataUri(uriInput.value.trim());
              if (parsed.mime.indexOf('image/') !== 0) throw new Error('That data URI is not an image.');
              uriPreview.appendChild(h('img', {
                src: uriInput.value.trim(),
                style: { maxWidth: '100%', marginTop: '12px', borderRadius: '8px', border: '1px solid var(--border)' }
              }));
            } catch (err) { uriPreview.appendChild(ui.banner('err', err.message)); }
          })
        ),
        uriPreview
      );

      root.appendChild(textCard);
      root.appendChild(fileCard);
      root.appendChild(fileOut);
      root.appendChild(decodeCard);

      plain.addEventListener('input', ui.debounce(encode, 250));
      encoded.addEventListener('input', ui.debounce(function () {
        if (document.activeElement === encoded) decode();
      }, 300));

      if (plain.value) encode();
    }
  });

  function parseDataUri(text) {
    var m = /^data:([^;,]*)(;charset=[^;,]*)?(;base64)?,([\s\S]*)$/i.exec(text);
    if (!m) throw new Error('That does not look like a data: URI.');
    var mime = m[1] || 'application/octet-stream';
    var body = m[4];
    var bytes = m[3]
      ? DevBox.ui.b64Decode(DevBox.ui.b64UrlToB64(body))
      : DevBox.ui.utf8Bytes(decodeURIComponent(body));
    return { mime: mime, bytes: bytes };
  }

  function suggestName(mime) {
    var ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp',
      'image/svg+xml': 'svg', 'application/pdf': 'pdf', 'text/plain': 'txt', 'application/json': 'json' }[mime];
    return 'decoded.' + (ext || (mime.split('/')[1] || 'bin').replace(/[^a-z0-9]/gi, ''));
  }
})();

(function () {

  DevBox.register({
    id: 'url',

      var encOut = ui.output({ title: 'Encoded / decoded' });

        ui.btn('Encode component', function () { safely(function () { encOut.set(encodeURIComponent(raw.value)); }); }, 'primary'),
        ui.btn('Encode full URL', function () { safely(function () { encOut.set(encodeURI(raw.value)); }); }),
        ui.btn('Decode', function () { safely(function () { encOut.set(decodeURIComponent(raw.value.replace(/\+/g, ' '))); }); }),
        ui.btn('Decode (keep +)', function () { safely(function () { encOut.set(decodeURIComponent(raw.value)); }); })
      ));

      function safely(fn) {
        try { fn(); } catch (err) { encOut.set(err.message + ' — the input contains an invalid percent sequence.', 'err'); }
      }

      /* ------------------------------------------------ parse */

          ['Host', url.hostname],
          ['Port', url.port || defaultPort(url.protocol)],
          ['Path', url.pathname],
          ['Query', url.search.replace(/^\?/, '')],

              });

          })

      root.appendChild(encodeCard);
      root.appendChild(encOut);
      root.appendChild(ui.card('Parse a URL', urlInput, h('div.mt12', parts)));

  });

  function defaultPort(protocol) {
    return { 'http:': '80 (default)', 'https:': '443 (default)', 'ftp:': '21 (default)', 'ws:': '80 (default)', 'wss:': '443 (default)' }[protocol] || '';
  }

  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
})();

/* ===== src/tools/escape.js ===== */
/* Escaping and unescaping for the formats that bite most often. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  var NAMED = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

  var MODES = {
    html: {
      label: 'HTML entities',
      hint: 'Turns & < > " \' into entities so text is safe inside markup.',
      escape: function (s) { return s.replace(/[&<>"']/g, function (c) { return NAMED[c]; }); },
      unescape: function (s) {
        return s.replace(/&(#x?[0-9a-f]+|[a-z]+);/gi, function (whole, body) {
          if (body[0] === '#') {
            var code = body[1] === 'x' || body[1] === 'X' ? parseInt(body.slice(2), 16) : parseInt(body.slice(1), 10);
            return isFinite(code) ? String.fromCodePoint(code) : whole;
          }
          var map = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: '\u00a0', copy: '\u00a9', reg: '\u00ae', hellip: '\u2026', mdash: '\u2014', ndash: '\u2013' };
          return map[body.toLowerCase()] || whole;
        });
      }
    },
    js: {
      label: 'JavaScript / JSON string',
      hint: 'Produces the body of a double-quoted string literal.',
      escape: function (s) { return JSON.stringify(s).slice(1, -1); },
      unescape: function (s) {
        // Hand-rolled rather than JSON.parse, so a stray `C:\path` degrades to
        // itself instead of throwing.
        var simple = { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', v: '\v', '0': '\0' };
        return s.replace(/\\(?:u\{([0-9a-fA-F]+)\}|u([0-9a-fA-F]{4})|x([0-9a-fA-F]{2})|([\s\S]))/g,
          function (whole, brace, u4, x2, ch) {
            if (brace) return String.fromCodePoint(parseInt(brace, 16));
            if (u4) return String.fromCharCode(parseInt(u4, 16));
            if (x2) return String.fromCharCode(parseInt(x2, 16));
            return simple[ch] !== undefined ? simple[ch] : ch;
          });
      }
    },
    sql: {
      label: 'SQL string literal',
      hint: "Doubles single quotes. Escaping is not a substitute for parameterised queries.",
      escape: function (s) { return s.replace(/'/g, "''"); },
      unescape: function (s) { return s.replace(/''/g, "'"); }
    },
    shell: {
      label: 'POSIX shell argument',
      hint: 'Wraps the value in single quotes so the shell treats it as one literal argument.',
      escape: function (s) { return "'" + s.replace(/'/g, "'\\''") + "'"; },
      unescape: function (s) { return s.replace(/^'|'$/g, '').replace(/'\\''/g, "'"); }
    },
    powershell: {
      label: 'PowerShell argument',
      hint: 'Single-quoted PowerShell literal: internal quotes are doubled.',
      escape: function (s) { return "'" + s.replace(/'/g, "''") + "'"; },
      unescape: function (s) { return s.replace(/^'|'$/g, '').replace(/''/g, "'"); }
    },
    regex: {
      label: 'Regular expression',
      hint: 'Escapes every character with a special meaning in a regex.',
      escape: function (s) { return s.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'); },
      unescape: function (s) { return s.replace(/\\([.*+?^${}()|[\]\\\/])/g, '$1'); }
    },
    unicode: {
      label: 'Unicode \\uXXXX',
      hint: 'Escapes every non-ASCII character to a \\uXXXX sequence.',
      escape: function (s) {
        return s.replace(/[^\x20-\x7E]/g, function (c) {
          return '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0');
        });
      },
      unescape: function (s) {

/* Number bases, bitwise arithmetic and byte sizes. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  var DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';

  DevBox.register({
    id: 'number',
    icon: '10',
    category: 'data',
    keywords: 'number base binary hex octal decimal radix bitwise shift bytes kb mib convert',
    name: { en: 'Number & Bits', uz: 'Sonlar va bitlar', ru: 'Числа и биты' },
    desc: {
      en: 'Convert between number bases with arbitrary precision, run bitwise operations, and translate byte sizes.',
      uz: 'Cheksiz aniqlikda sanoq sistemalarini oʻgirish, bit amallari va bayt oʻlchamlarini hisoblash.',
      ru: 'Перевод между системами счисления с произвольной точностью, побитовые операции и размеры в байтах.'
    },

    mount: function (root, ctx) {
      /* ------------------------------------------------ base converter */

      var fields = {};
      var bases = [[2, 'Binary'], [8, 'Octal'], [10, 'Decimal'], [16, 'Hexadecimal']];
      var grid = h('div.grid2');
      var baseError = h('div');

      bases.forEach(function (pair) {
        var box = ui.input({ placeholder: 'base ' + pair[0], label: pair[1].toUpperCase() + ' (base ' + pair[0] + ')' });
        fields[pair[0]] = box;
        box.control.addEventListener('input', function () { sync(pair[0]); });
        grid.appendChild(box);
      });

      var customBase = ui.input({ type: 'number', value: ctx.store.get('customBase', 36), min: 2, max: 36, label: 'CUSTOM BASE (2–36)' });
      var customValue = ui.input({ label: 'VALUE IN THAT BASE' });
      customValue.control.addEventListener('input', function () { sync('custom'); });
      customBase.control.addEventListener('input', function () {
        ctx.store.set('customBase', customBase.value);
        sync(10);
      });

      var bitView = h('div.out.empty', { text: 'Enter a number to see its bit layout.' });

      function sync(source) {
        ui.clear(baseError);
        var base = source === 'custom' ? Number(customBase.value) : source;
        var text = source === 'custom' ? customValue.value : fields[source].value;

        if (!String(text).trim()) {
          bases.forEach(function (pair) { if (pair[0] !== source) fields[pair[0]].value = ''; });
          if (source !== 'custom') customValue.value = '';
          renderBits(null);
          return;
        }

        if (!(base >= 2 && base <= 36)) {
          baseError.appendChild(ui.banner('err', 'Custom base must be between 2 and 36.'));
          return;
        }

        var value = parseBase(text, base);
        if (value === null) {
          baseError.appendChild(ui.banner('err', '“' + text + '” is not a valid base-' + base + ' number.'));
          return;
        }

        bases.forEach(function (pair) {
          if (pair[0] !== source) fields[pair[0]].value = toBase(value, pair[0]);
        });
        if (source !== 'custom') customValue.value = toBase(value, Number(customBase.value) || 36);
        renderBits(value);
      }

      function renderBits(value) {
        if (value === null || value < 0n) {
          bitView.textContent = value === null ? 'Enter a number to see its bit layout.' : 'Bit layout is shown for non-negative values.';
          bitView.classList.add('empty');
          return;
        }
        bitView.classList.remove('empty');
        var bin = value.toString(2);
        var width = bin.length <= 8 ? 8 : bin.length <= 16 ? 16 : bin.length <= 32 ? 32 : bin.length <= 64 ? 64 : Math.ceil(bin.length / 8) * 8;
        var padded = bin.padStart(width, '0');
        var groups = padded.match(/.{1,8}/g) || [];
        var lines = ['bits  ' + width, ''];
        groups.forEach(function (group, i) {
          var high = width - i * 8 - 1;
          lines.push(String(high).padStart(3) + '..' + String(high - 7).padStart(2) + '   ' + group.replace(/(.{4})(?=.)/g, '$1 '));
        });
        bitView.textContent = lines.join('\n');
      }

      /* ------------------------------------------------ bitwise */

      var opA = ui.input({ value: '0xF0', label: 'A' });
      var opB = ui.input({ value: '0x0F', label: 'B' });
      var width = ui.select({ options: [['8', '8-bit'], ['16', '16-bit'], ['32', '32-bit'], ['64', '64-bit']], value: ctx.store.get('width', '32'), label: 'WIDTH' });
      var bitOut = h('div.tbl-scroll');

      function bitwise() {
        ctx.store.set('width', width.value);
        ui.clear(bitOut);

        var a = parseAuto(opA.value);
        var b = parseAuto(opB.value);
        if (a === null || b === null) {
          bitOut.appendChild(h('div', { style: { padding: '10px' } }, ui.banner('err', 'Enter two integers. Prefix with 0x, 0b or 0o to pick a base.')));
          return;
        }

        var bits = BigInt(width.value);
        var mask = (1n << bits) - 1n;
        var wrap = function (v) { return ((v % (mask + 1n)) + mask + 1n) & mask; };

        var rows = [
          ['A', wrap(a)],
          ['B', wrap(b)],
          ['A & B', wrap(a & b)],
          ['A | B', wrap(a | b)],
          ['A ^ B', wrap(a ^ b)],
          ['~A', wrap(~a)],
          ['A << 1', wrap(a << 1n)],
          ['A >> 1', wrap(a >> 1n)],
          ['A + B', wrap(a + b)],
          ['A - B', wrap(a - b)]
        ];

        bitOut.appendChild(h('table.tbl',
          h('thead', h('tr', h('th', 'Expression'), h('th', 'Decimal'), h('th', 'Hex'), h('th', 'Binary'))),
          h('tbody', rows.map(function (row) {
            return h('tr',
              h('td.mono', { text: row[0] }),
              h('td.mono', { text: row[1].toString(10) }),
              h('td.mono', { text: '0x' + row[1].toString(16).toUpperCase().padStart(Number(width.value) / 4, '0') }),
              h('td.mono', { text: row[1].toString(2).padStart(Number(width.value), '0').replace(/(.{8})(?=.)/g, '$1 ') })
            );
          }))
        ));
      }

      /* ------------------------------------------------ byte sizes */

      var sizeInput = ui.input({ value: '1536', label: 'AMOUNT' });
      var sizeUnit = ui.select({
        options: [['1', 'bytes'], ['1024', 'KiB'], ['1048576', 'MiB'], ['1073741824', 'GiB'],
                  ['1000', 'kB'], ['1000000', 'MB'], ['1000000000', 'GB']],
        value: '1', label: 'UNIT'
      });
      var sizeOut = h('dl.kv');

      function sizes() {
        ui.clear(sizeOut);
        var amount = Number(sizeInput.value);
        if (!isFinite(amount)) { sizeOut.appendChild(h('dt', { text: 'Error' })); sizeOut.appendChild(h('dd', { text: 'Not a number' })); return; }
        var bytes = amount * Number(sizeUnit.value);
        [
          ['Bytes', bytes.toLocaleString('en-US')],
          ['KiB (1024)', (bytes / 1024).toLocaleString('en-US', { maximumFractionDigits: 4 })],
          ['MiB', (bytes / 1048576).toLocaleString('en-US', { maximumFractionDigits: 6 })],
          ['GiB', (bytes / 1073741824).toLocaleString('en-US', { maximumFractionDigits: 6 })],
          ['kB (1000)', (bytes / 1000).toLocaleString('en-US', { maximumFractionDigits: 4 })],
          ['MB', (bytes / 1e6).toLocaleString('en-US', { maximumFractionDigits: 6 })],
          ['GB', (bytes / 1e9).toLocaleString('en-US', { maximumFractionDigits: 6 })],
          ['Bits', (bytes * 8).toLocaleString('en-US')]
        ].forEach(function (row) {
          sizeOut.appendChild(h('dt', { text: row[0] }));
          sizeOut.appendChild(h('dd', { text: row[1] }));
        });
      }

      /* ------------------------------------------------ layout */

      var baseCard = ui.card('Base converter', grid, h('div.grid2.mt12', customBase, customValue), baseError, h('div.mt12', bitView));
      var bitCard = ui.card('Bitwise operations', h('div.grid3', opA, opB, width), h('div.mt12', bitOut));
      bitCard.body.appendChild(h('div.note.mt8', { text: 'Results are shown wrapped to the selected width, the way they would land in a fixed-size integer.' }));
      var sizeCard = ui.card('Byte sizes', h('div.grid2', sizeInput, sizeUnit), h('div.mt12', sizeOut));

      root.appendChild(baseCard);
      root.appendChild(bitCard);
      root.appendChild(sizeCard);

      [opA, opB].forEach(function (f) { f.control.addEventListener('input', ui.debounce(bitwise, 200)); });
      width.addEventListener('change', bitwise);
      sizeInput.control.addEventListener('input', ui.debounce(sizes, 200));
      sizeUnit.addEventListener('change', sizes);

      fields[10].value = '';
      bitwise();
      sizes();
    }
  });

  /* ---------------------------------------------------------- helpers */

  function parseBase(text, base) {
    var s = String(text).trim().toLowerCase().replace(/[\s_,]/g, '');
    var negative = false;
    if (s[0] === '-') { negative = true; s = s.slice(1); }
    else if (s[0] === '+') s = s.slice(1);
    if (base === 16) s = s.replace(/^0x/, '');
    if (base === 2) s = s.replace(/^0b/, '');
    if (base === 8) s = s.replace(/^0o/, '');
    if (!s) return null;

    var value = 0n, big = BigInt(base);
    for (var i = 0; i < s.length; i++) {
      var digit = DIGITS.indexOf(s[i]);
      if (digit < 0 || digit >= base) return null;
      value = value * big + BigInt(digit);
    }
    return negative ? -value : value;
  }

  /** Accepts 0x / 0b / 0o prefixes, otherwise decimal. */
  function parseAuto(text) {
    var s = String(text).trim().toLowerCase().replace(/[\s_,]/g, '');
    var negative = s[0] === '-';
    if (negative) s = s.slice(1);
    var value;
    if (/^0x[0-9a-f]+$/.test(s)) value = parseBase(s, 16);
    else if (/^0b[01]+$/.test(s)) value = parseBase(s, 2);
    else if (/^0o[0-7]+$/.test(s)) value = parseBase(s, 8);
    else if (/^\d+$/.test(s)) value = parseBase(s, 10);
    else return null;
    if (value === null) return null;
    return negative ? -value : value;
  }

  function toBase(value, base) {
    if (value < 0n) return '-' + (-value).toString(base);
    return value.toString(base);
  }
})();

/* Hashes and HMACs for text and files. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  var ALGOS = ['MD5', 'SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];

  DevBox.register({
    id: 'hash',
    icon: '#',
    category: 'security',
    keywords: 'hash md5 sha1 sha256 sha512 checksum hmac digest fingerprint verify file',
    name: { en: 'Hash & HMAC', uz: 'Xesh va HMAC', ru: 'Хеши и HMAC' },
    desc: {
      en: 'MD5, SHA-1 and SHA-2 digests for text or a whole file, plus keyed HMACs and a constant-time comparison.',
      uz: 'Matn yoki butun fayl uchun MD5, SHA-1 va SHA-2 xeshlari, kalitli HMAC va xeshni solishtirish.',
      ru: 'Дайджесты MD5, SHA-1 и SHA-2 для текста или файла, HMAC с ключом и сверка контрольной суммы.'
    },

    mount: function (root, ctx) {
      if (!window.crypto || !crypto.subtle) {
        root.appendChild(ui.banner('warn',
          'This browser exposes no Web Crypto API here, so only MD5 is available. Serving the page over http://localhost or https:// restores the SHA family.'));
      }

      /* ------------------------------------------------ text */

      var input = ui.textarea({ placeholder: 'Text to hash', value: ctx.store.get('input', '') });
      var upper = ui.checkbox('Uppercase', ctx.store.get('upper', false), function () {
        ctx.store.set('upper', upper.checked);
        hashText();
      });
      var results = h('div');

      function hashText() {
        ctx.store.set('input', input.value.slice(0, 50000));
        var bytes = ui.utf8Bytes(input.value);
        render(results, bytes, input.value === '' ? 'Hashes of the empty string:' : null);
      }

      function render(host, bytes, note) {
        ui.clear(host);
        if (note) host.appendChild(h('div.note', { text: note, style: { marginBottom: '8px' } }));
        var list = h('dl.kv');
        host.appendChild(list);

        ALGOS.forEach(function (algo) {
          var dt = h('dt', { text: algo });
          var dd = h('dd', { text: '…' });
          dd.style.cursor = 'pointer';
          dd.title = 'Click to copy';
          dd.addEventListener('click', function () { ui.copy(dd.textContent); });
          list.appendChild(dt);
          list.appendChild(dd);

          digest(algo, bytes).then(function (hex) {
            dd.textContent = upper.checked ? hex.toUpperCase() : hex;
          }, function (err) {
            dd.textContent = 'unavailable (' + err.message + ')';
            dd.style.color = 'var(--text-faint)';
          });
        });
      }

      /* ------------------------------------------------ file */

      var fileResults = h('div');
      var fileZone = ui.dropzone('Drop a file to checksum it — the bytes never leave your machine', function (file) {
        var reader = new FileReader();
        ui.clear(fileResults).appendChild(h('div.note', { text: 'Reading ' + file.name + ' (' + ui.bytes(file.size) + ')…' }));
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          ui.clear(fileResults);
          fileResults.appendChild(h('div.row.mt8',
            ui.chip(file.name), ui.chip(ui.bytes(file.size)), ui.chip(file.type || 'unknown type')));
          var host = h('div.mt12');
          fileResults.appendChild(host);
          render(host, bytes);
        };
        reader.onerror = function () { ui.clear(fileResults).appendChild(ui.banner('err', 'Could not read that file.')); };
        reader.readAsArrayBuffer(file);
      });

      /* ------------------------------------------------ hmac */

      var hmacMsg = ui.textarea({ short: true, placeholder: 'Message' });
      var hmacKey = ui.input({ placeholder: 'Secret key' });
      var hmacAlgo = ui.select({ options: [['SHA-256', 'HMAC-SHA-256'], ['SHA-1', 'HMAC-SHA-1'], ['SHA-384', 'HMAC-SHA-384'], ['SHA-512', 'HMAC-SHA-512']], value: 'SHA-256' });
      var hmacOut = ui.output({ title: 'HMAC' });

      function computeHmac() {
        if (!crypto.subtle) return hmacOut.set('Web Crypto is unavailable in this context.', 'err');
        if (!hmacKey.value) return hmacOut.set('');
        crypto.subtle.importKey('raw', ui.utf8Bytes(hmacKey.value), { name: 'HMAC', hash: hmacAlgo.value }, false, ['sign'])
          .then(function (key) { return crypto.subtle.sign('HMAC', key, ui.utf8Bytes(hmacMsg.value)); })
          .then(function (sig) {
            var hex = ui.toHex(sig);
            hmacOut.set(hex + '\n\nbase64: ' + ui.b64Encode(new Uint8Array(sig)));
          })
          .catch(function (err) { hmacOut.set(err.message, 'err'); });
      }

      /* ------------------------------------------------ compare */

      var expected = ui.input({ placeholder: 'Paste the expected checksum' });
      var actual = ui.input({ placeholder: 'Paste the computed checksum' });
      var compareOut = h('div');

      function compare() {
        ui.clear(compareOut);
        var a = expected.value.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
        var b = actual.value.trim().toLowerCase().replace(/[^0-9a-f]/g, '');
        if (!a || !b) return;
        // Constant-time-ish: always walk both strings fully.
        var same = a.length === b.length;
        var diff = 0;
        for (var i = 0; i < Math.max(a.length, b.length); i++) {
          if (a.charCodeAt(i) !== b.charCodeAt(i)) diff++;
        }
        same = same && diff === 0;
        compareOut.appendChild(same
          ? ui.banner('ok', 'The two checksums match.')
          : ui.banner('err', 'They do not match — ' + diff + ' character' + (diff === 1 ? '' : 's') + ' differ.'));
      }

      /* ------------------------------------------------ layout */

      root.appendChild(ui.card('Text', input, h('div.row.mt12', upper), h('div.mt12', results)));
      root.appendChild(ui.card('File checksum', fileZone, fileResults));
      root.appendChild(ui.card('HMAC', h('div.grid2', hmacKey, hmacAlgo), h('div.mt12', hmacMsg),
        h('div.row.mt12', ui.btn('Compute HMAC', computeHmac, 'primary')), h('div.mt12', hmacOut)));
      root.appendChild(ui.card('Compare two checksums', h('div.grid2', expected, actual), h('div.mt12', compareOut)));

      input.addEventListener('input', ui.debounce(hashText, 250));
      [expected, actual].forEach(function (f) { f.control.addEventListener('input', ui.debounce(compare, 200)); });
      hmacMsg.addEventListener('input', ui.debounce(computeHmac, 300));
      hmacKey.control.addEventListener('input', ui.debounce(computeHmac, 300));
      hmacAlgo.addEventListener('change', computeHmac);

      hashText();
    }
  });

  function digest(algo, bytes) {
    if (algo === 'MD5') {
      try { return Promise.resolve(ui.toHex(DevBox.md5(bytes))); }
      catch (err) { return Promise.reject(err); }
    }
    if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('Web Crypto unavailable'));
    return crypto.subtle.digest(algo, bytes).then(function (buf) { return ui.toHex(buf); });
  }
})();

/* JWT decoding, claim inspection and HMAC signature verification. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  var TIME_CLAIMS = { exp: 'Expires', iat: 'Issued at', nbf: 'Not before', auth_time: 'Authenticated at', updated_at: 'Updated at' };

  var CLAIM_NOTES = {
    iss: 'Issuer', sub: 'Subject', aud: 'Audience', jti: 'JWT ID',
    scope: 'Scopes', azp: 'Authorized party', typ: 'Type', alg: 'Algorithm', kid: 'Key ID'
  };

  DevBox.register({
    id: 'jwt',
    icon: '🎟',
    category: 'security',
    keywords: 'jwt token decode verify jws claims bearer auth oauth signature hs256',
    name: { en: 'JWT Decoder', uz: 'JWT dekoder', ru: 'JWT-декодер' },
    desc: {
      en: 'Decode a JSON Web Token, read its claims in plain language, and verify an HMAC signature locally.',
      uz: 'JWT’ni ochish, daʼvolarini tushunarli tilda koʻrish va HMAC imzosini shu yerda tekshirish.',
      ru: 'Разбор JSON Web Token, понятное представление claim-ов и локальная проверка HMAC-подписи.'
    },

    mount: function (root, ctx) {
      root.appendChild(ui.banner('info',
        'Tokens pasted here are decoded in this page only. Nothing is sent anywhere — which is exactly why you should not paste production tokens into online decoders.'));

      var input = ui.textarea({ short: true, placeholder: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U', value: ctx.store.get('token', '') });

      var status = h('div');
      var headerOut = ui.output({ title: 'Header' });
      var payloadOut = ui.output({ title: 'Payload' });
      var claims = h('div');
      var claimsCard = ui.card('Claims', claims);

      var secret = ui.input({ placeholder: 'HMAC secret (or base64: prefix for raw key bytes)' });
      var verifyOut = h('div');

      var parsed = null;

      function decode() {
        ctx.store.set('token', input.value.slice(0, 20000));
        ui.clear(status);
        ui.clear(claims);
        ui.clear(verifyOut);
        parsed = null;

        var token = input.value.trim().replace(/^Bearer\s+/i, '');
        if (!token) { headerOut.set(''); payloadOut.set(''); claimsCard.style.display = 'none'; return; }

        var segments = token.split('.');
        if (segments.length < 2) {
          status.appendChild(ui.banner('err', 'A JWT has at least two dot-separated segments; this has ' + segments.length + '.'));
          headerOut.set(''); payloadOut.set('');
          claimsCard.style.display = 'none';
          return;
        }

        var header, payload;
        try { header = JSON.parse(ui.bytesToUtf8(ui.b64Decode(ui.b64UrlToB64(segments[0])))); }
        catch (err) { status.appendChild(ui.banner('err', 'The header is not valid base64url JSON: ' + err.message)); return; }
        try { payload = JSON.parse(ui.bytesToUtf8(ui.b64Decode(ui.b64UrlToB64(segments[1])))); }
        catch (err) {
          status.appendChild(ui.banner('err', 'The payload is not valid base64url JSON: ' + err.message));
          headerOut.set(JSON.stringify(header, null, 2));
          return;
        }

        parsed = { header: header, payload: payload, segments: segments };
        headerOut.set(JSON.stringify(header, null, 2));
        payloadOut.set(JSON.stringify(payload, null, 2));
        claimsCard.style.display = '';

        if (header.alg === 'none') {
          status.appendChild(ui.banner('warn', 'This token declares alg: "none" — it carries no signature and must never be trusted.'));
        } else if (segments.length < 3 || !segments[2]) {
          status.appendChild(ui.banner('warn', 'The signature segment is missing.'));
        }

        renderClaims(payload, header);
      }

      function renderClaims(payload, header) {
        var now = Date.now() / 1000;
        var list = h('dl.kv');

        list.appendChild(h('dt', { text: 'Algorithm' }));
        list.appendChild(h('dd', { text: (header.alg || '—') + (header.typ ? '  ·  typ ' + header.typ : '') + (header.kid ? '  ·  kid ' + header.kid : '') }));

        Object.keys(payload).forEach(function (key) {
          var value = payload[key];
          var label = TIME_CLAIMS[key] || CLAIM_NOTES[key] || key;
          list.appendChild(h('dt', { text: label + (label === key ? '' : ' (' + key + ')') }));

          if (TIME_CLAIMS[key] && typeof value === 'number') {
            var when = new Date(value * 1000);
            list.appendChild(h('dd', { text: when.toISOString() + '  ·  ' + relative(value - now) }));
          } else if (typeof value === 'object') {
            list.appendChild(h('dd', { text: JSON.stringify(value) }));
          } else {
            list.appendChild(h('dd', { text: String(value) }));
          }
        });

        claims.appendChild(list);

        if (typeof payload.exp === 'number') {
          var left = payload.exp - now;
          claims.appendChild(h('div.mt12', left <= 0
            ? ui.banner('err', 'Expired ' + relative(left) + '.')
            : ui.banner('ok', 'Valid for another ' + duration(left) + '.')));
        }
        if (typeof payload.nbf === 'number' && payload.nbf > now) {
          claims.appendChild(h('div.mt8', ui.banner('warn', 'Not valid yet — starts ' + relative(payload.nbf - now) + '.')));
        }
      }

      function verify() {
        ui.clear(verifyOut);
        if (!parsed) return verifyOut.appendChild(ui.banner('err', 'Decode a token first.'));
        if (parsed.segments.length < 3) return verifyOut.appendChild(ui.banner('err', 'This token has no signature segment.'));
        if (!crypto.subtle) return verifyOut.appendChild(ui.banner('err', 'Web Crypto is unavailable in this context.'));

        var alg = parsed.header.alg || '';
        var hash = { HS256: 'SHA-256', HS384: 'SHA-384', HS512: 'SHA-512' }[alg];
        if (!hash) {
          return verifyOut.appendChild(ui.banner('warn',
            'Only HS256/HS384/HS512 can be checked with a shared secret. This token uses "' + alg + '", which needs the issuer’s public key.'));
        }

        var keyBytes;
        try {
          keyBytes = /^base64:/i.test(secret.value)
            ? ui.b64Decode(ui.b64UrlToB64(secret.value.replace(/^base64:/i, '')))
            : ui.utf8Bytes(secret.value);
        } catch (err) {
          return verifyOut.appendChild(ui.banner('err', 'The base64 secret could not be decoded.'));
        }

        var signed = ui.utf8Bytes(parsed.segments[0] + '.' + parsed.segments[1]);
        var signature = ui.b64Decode(ui.b64UrlToB64(parsed.segments[2]));

        crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: hash }, false, ['verify'])
          .then(function (key) { return crypto.subtle.verify('HMAC', key, signature, signed); })
          .then(function (valid) {
            verifyOut.appendChild(valid
              ? ui.banner('ok', 'Signature is valid for this secret (' + alg + ').')
              : ui.banner('err', 'Signature does not match this secret.'));
          })
          .catch(function (err) { verifyOut.appendChild(ui.banner('err', err.message)); });
      }

      root.appendChild(ui.card('Token', input, h('div.row.mt12',
        ui.btn('Decode', decode, 'primary'),
        ui.btn('Clear', function () { input.value = ''; decode(); }, 'ghost')
      )));
      root.appendChild(status);
      root.appendChild(h('div.grid2', headerOut, payloadOut));
      root.appendChild(claimsCard);
      root.appendChild(ui.card('Verify signature',
        h('div.row', secret, ui.btn('Verify', verify, 'primary')),
        h('div.mt12', verifyOut)
      ));

      input.addEventListener('input', ui.debounce(decode, 300));
      secret.control.addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });
      decode();
    }
  });

  function duration(seconds) {
    seconds = Math.abs(Math.round(seconds));
    var units = [['year', 31536000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
    for (var i = 0; i < units.length; i++) {
      if (seconds >= units[i][1] || i === units.length - 1) {
        var n = Math.floor(seconds / units[i][1]);
        return n + ' ' + units[i][0] + (n === 1 ? '' : 's');
      }
    }
    return seconds + ' seconds';
  }

  function relative(delta) {
    return delta >= 0 ? 'in ' + duration(delta) : duration(delta) + ' ago';
  }
})();

/* Identifier generation: UUID v4/v7, ULID, NanoID and raw randomness. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  var NANOID_ALPHABET = 'useandom-26T198340PX75pxJACKVERYMINDBUSHWOLF_GQZbfghjklqvwyzrict';
  var CROCKFORD = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';

  DevBox.register({
    id: 'uuid',
    icon: 'ID',
    category: 'security',
    keywords: 'uuid guid v4 v7 ulid nanoid random id generate identifier unique',
    name: { en: 'ID Generator', uz: 'ID generator', ru: 'Генератор ID' },
    desc: {
      en: 'Generate UUID v4 and v7, ULIDs, NanoIDs and random hex — all from the browser’s cryptographic RNG.',
      uz: 'UUID v4 va v7, ULID, NanoID va tasodifiy hex hosil qiling — brauzerning kriptografik tasodif manbasidan.',
      ru: 'Генерация UUID v4 и v7, ULID, NanoID и случайного hex на основе криптографического ГСЧ браузера.'
    },

    mount: function (root, ctx) {
      var kind = ui.select({
        options: [
          ['uuid4', 'UUID v4 — random'],
          ['uuid7', 'UUID v7 — time-ordered'],
          ['ulid', 'ULID — sortable, 26 chars'],
          ['nanoid', 'NanoID — 21 chars, URL-safe'],
          ['hex', 'Random hex'],
          ['bytes', 'Random base64']
        ],
        value: ctx.store.get('kind', 'uuid4'),
        label: 'FORMAT'
      });

      var count = ui.input({ type: 'number', value: ctx.store.get('count', 5), min: 1, max: 1000, label: 'HOW MANY' });
      var size = ui.input({ type: 'number', value: ctx.store.get('size', 16), min: 1, max: 256, label: 'BYTES (hex / base64 only)' });
      var uppercase = ui.checkbox('Uppercase', false, generate);
      var braces = ui.checkbox('Wrap in { } braces', false, generate);
      var hyphens = ui.checkbox('Keep hyphens', true, generate);

      var out = ui.output({ title: 'Generated', download: 'ids.txt' });
      var explain = h('div');

      var DESCRIPTIONS = {
        uuid4: 'Version 4 UUIDs are 122 bits of randomness. Collision risk is negligible, but they sort arbitrarily, which fragments database indexes.',
        uuid7: 'Version 7 UUIDs put a 48-bit Unix millisecond timestamp first, so they sort by creation time — much friendlier to B-tree indexes than v4.',
        ulid: 'ULIDs pack a 48-bit timestamp and 80 random bits into 26 Crockford base32 characters: lexicographically sortable and case-insensitive.',
        nanoid: 'NanoIDs are 21 URL-safe characters (~126 bits). Shorter than a UUID with comparable collision resistance.',
        hex: 'Raw random bytes rendered as hexadecimal — useful for API keys, salts and session tokens.',
        bytes: 'Raw random bytes rendered as base64 — compact for secrets stored in environment variables.'
      };

      function generate() {
        ctx.store.set('kind', kind.value);
        ctx.store.set('count', count.value);
        ctx.store.set('size', size.value);

        var n = clamp(Number(count.value) || 1, 1, 1000);
        var byteLen = clamp(Number(size.value) || 16, 1, 256);
        var lines = [];

        for (var i = 0; i < n; i++) {
          var value;
          switch (kind.value) {
            case 'uuid4': value = uuidV4(); break;
            case 'uuid7': value = uuidV7(); break;
            case 'ulid': value = ulid(); break;
            case 'nanoid': value = nanoid(21); break;
            case 'hex': value = ui.toHex(randomBytes(byteLen)); break;
            default: value = ui.b64Encode(randomBytes(byteLen));
          }
          if (/^uuid/.test(kind.value)) {
            if (!hyphens.checked) value = value.replace(/-/g, '');
            if (braces.checked) value = '{' + value + '}';
          }
          if (uppercase.checked && kind.value !== 'nanoid' && kind.value !== 'bytes') value = value.toUpperCase();
          lines.push(value);
        }

        out.set(lines.join('\n'));
        ui.clear(explain).appendChild(h('div.note', { text: DESCRIPTIONS[kind.value] }));
      }

      /* ------------------------------------------------ inspector */

      var inspectInput = ui.input({ placeholder: 'Paste a UUID or ULID to inspect it' });
      var inspectOut = h('div');

      function inspect() {
        ui.clear(inspectOut);
        var text = inspectInput.value.trim().replace(/[{}]/g, '');
        if (!text) return;

        var uuidMatch = /^([0-9a-f]{8})-?([0-9a-f]{4})-?([0-9a-f]{4})-?([0-9a-f]{4})-?([0-9a-f]{12})$/i.exec(text);
        if (uuidMatch) {
          var hex = uuidMatch.slice(1).join('').toLowerCase();
          var version = parseInt(hex[12], 16);
          var variantNibble = parseInt(hex[16], 16);
          var variant = variantNibble >= 8 && variantNibble <= 11 ? 'RFC 4122' :
                        variantNibble >= 12 && variantNibble <= 13 ? 'Microsoft' :
                        variantNibble >= 14 ? 'reserved' : 'NCS (legacy)';

          var rows = [['Version', version], ['Variant', variant], ['Hex', hex]];
          if (version === 7) {
            var ms = parseInt(hex.slice(0, 12), 16);
            rows.push(['Timestamp', new Date(ms).toISOString()]);
          } else if (version === 1) {
            var timeLow = BigInt('0x' + hex.slice(0, 8));
            var timeMid = BigInt('0x' + hex.slice(8, 12));
            var timeHigh = BigInt('0x' + hex.slice(13, 16));
            var ticks = (timeHigh << 48n) | (timeMid << 32n) | timeLow;
            rows.push(['Timestamp', new Date(Number(ticks / 10000n - 12219292800000n)).toISOString()]);
          }
          return showRows(rows);
        }

        if (/^[0-9A-HJKMNP-TV-Z]{26}$/i.test(text)) {
          var ms2 = 0;
          text.toUpperCase().slice(0, 10).split('').forEach(function (c) { ms2 = ms2 * 32 + CROCKFORD.indexOf(c); });
          return showRows([['Format', 'ULID'], ['Timestamp', new Date(ms2).toISOString()], ['Randomness', text.slice(10)]]);
        }

        inspectOut.appendChild(ui.banner('warn', 'That is neither a UUID nor a ULID.'));

        function showRows(rows) {
          var list = h('dl.kv');
          rows.forEach(function (row) {
            list.appendChild(h('dt', { text: row[0] }));
            list.appendChild(h('dd', { text: String(row[1]) }));
          });
          inspectOut.appendChild(list);
        }
      }

      root.appendChild(ui.card('Generate',
        h('div.grid3', kind, count, size),
        h('div.row.mt12', ui.btn('Generate', generate, 'primary'), uppercase, braces, hyphens),
        h('div.mt12', explain)
      ));
      root.appendChild(out);
      root.appendChild(ui.card('Inspect an existing ID', inspectInput, h('div.mt12', inspectOut)));

      kind.addEventListener('change', generate);
      count.control.addEventListener('input', ui.debounce(generate, 250));
      size.control.addEventListener('input', ui.debounce(generate, 250));
      inspectInput.control.addEventListener('input', ui.debounce(inspect, 200));
      generate();
    }
  });

  /* ---------------------------------------------------------- generators */

  function randomBytes(n) {
    var bytes = new Uint8Array(n);
    crypto.getRandomValues(bytes);
    return bytes;
  }

  function uuidV4() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = randomBytes(16);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    return format(b);
  }

  function uuidV7() {
    var b = randomBytes(16);
    var ms = Date.now();
    // 48-bit big-endian millisecond timestamp, then version and variant bits.
    b[0] = (ms / 1099511627776) & 0xff;
    b[1] = (ms / 4294967296) & 0xff;
    b[2] = (ms / 16777216) & 0xff;
    b[3] = (ms / 65536) & 0xff;
    b[4] = (ms / 256) & 0xff;
    b[5] = ms & 0xff;
    b[6] = (b[6] & 0x0f) | 0x70;
    b[8] = (b[8] & 0x3f) | 0x80;
    return format(b);
  }

  function format(b) {
    var hex = DevBox.ui.toHex(b);
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function ulid() {
    var ms = Date.now();
    var time = '';
    for (var i = 9; i >= 0; i--) {
      time = CROCKFORD[ms % 32] + time;
      ms = Math.floor(ms / 32);
    }
    var bytes = randomBytes(16);
    var random = '';
    for (var j = 0; j < 16; j++) random += CROCKFORD[bytes[j] % 32];
    return time + random;
  }

  function nanoid(length) {
    var bytes = randomBytes(length);
    var out = '';
    for (var i = 0; i < length; i++) out += NANOID_ALPHABET[bytes[i] & 63];
    return out;
  }

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
})();

    else if (bits < 80) { label = 'Strong'; colour = 'var(--ok)'; }

    var bar = h('div', { style: { height: '6px', background: 'var(--border)', borderRadius: '4px', overflow: 'hidden', marginTop: '8px' } },
      h('div', { style: { height: '100%', width: Math.min(100, bits / 128 * 100) + '%', background: colour, transition: 'width .2s' } }));

    return h('div',
      h('div.row', h('b', { text: label, style: { color: colour } }), h('span.note', { text: Math.round(bits) + ' bits of entropy · ' + detail })),
      bar,
      h('div.note.mt8', { text: 'At a trillion guesses per second, an exhaustive search would average ' + crackTime(bits) + '.' })
    );
  }

  function crackTime(bits) {
    var seconds = Math.pow(2, bits - 1) / 1e12;
    var units = [['billion years', 3.15e16], ['million years', 3.15e13], ['thousand years', 3.15e10],
                 ['years', 3.15e7], ['days', 86400], ['hours', 3600], ['minutes', 60], ['seconds', 1]];
    for (var i = 0; i < units.length; i++) {
      if (seconds >= units[i][1]) {
        var n = seconds / units[i][1];
        return (n >= 1000 ? n.toExponential(1) : n.toFixed(n < 10 ? 1 : 0)) + ' ' + units[i][0];
      }
    }
    return 'well under a second';
  }

  /** Uniform pick with rejection sampling — no modulo bias. */
  function randomBelow(limit) {
    var range = 4294967296;
    var buf = new Uint32Array(1);
    var cutoff = range - (range % limit);
    do { crypto.getRandomValues(buf); } while (buf[0] >= cutoff);
    return buf[0] % limit;
  }

  function pick(chars, length) {
    var out = '';
    for (var i = 0; i < length; i++) out += chars[randomBelow(chars.length)];
    return out;
  }
})();

    for (var guard = 0; guard < 500000 && out.length < howMany; guard++) {
      if (cursor.getFullYear() - from.getFullYear() > 8) break;

      if (!spec.month.has(cursor.getMonth() + 1)) {
        cursor.setMonth(cursor.getMonth() + 1, 1);
        cursor.setHours(0, 0, 0, 0);
        continue;
      }
      if (!dayMatches(cursor, spec)) {
        cursor.setDate(cursor.getDate() + 1);
        cursor.setHours(0, 0, 0, 0);
        continue;
      }
      if (!spec.hour.has(cursor.getHours())) {
        cursor.setHours(cursor.getHours() + 1, 0, 0, 0);
        continue;
      }
      if (!spec.minute.has(cursor.getMinutes())) {
        cursor.setMinutes(cursor.getMinutes() + 1, 0, 0);
        continue;
      }

      out.push(new Date(cursor.getTime()));
      cursor.setMinutes(cursor.getMinutes() + 1);
    }
    return out;
  }

  function dayMatches(date, spec) {
    var domOk = spec.dom.has(date.getDate());
    var dowOk = spec.dow.has(date.getDay());
    if (spec.domRestricted && spec.dowRestricted) return domOk || dowOk;
    if (spec.domRestricted) return domOk;
    if (spec.dowRestricted) return dowOk;
    return true;
  }

  function format(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + '  ' + DOW_NAMES[date.getDay()].slice(0, 3);
  }

  function gap(ms) {
    var seconds = Math.round(Math.abs(ms) / 1000);
    var units = [['d', 86400], ['h', 3600], ['m', 60]];
    var parts = [];
    units.forEach(function (unit) {
      var n = Math.floor(seconds / unit[1]);
      if (n > 0) { parts.push(n + unit[0]); seconds -= n * unit[1]; }
    });
    if (!parts.length) return 'under a minute';
    return parts.slice(0, 2).join(' ');
  }
})();

(function () {

    ['\\b  \\B', 'word boundary / not a word boundary'],
    ['*  +  ?', '0 or more, 1 or more, optional'],
    ['{2}  {2,}  {2,5}', 'exact, at-least, and bounded repetition'],
    ['*?  +?', 'lazy quantifiers — match as little as possible'],
    ['(abc)', 'capture group'],
    ['(?:abc)', 'group without capturing'],
    ['(?<name>abc)', 'named capture group'],
    ['a|b', 'alternation'],
    ['(?=abc)  (?!abc)', 'lookahead: followed by / not followed by'],

    ['\\b[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}\\b', 'Email address'],
    ['^(?:\\+?998)?[\\s-]?\\d{2}[\\s-]?\\d{3}[\\s-]?\\d{2}[\\s-]?\\d{2}$', 'Uzbek phone number'],
    ['^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$', 'IPv4 address'],
    ['https?://[^\\s"\'<>]+', 'URL'],
    ['^#?([a-f\\d]{3}|[a-f\\d]{6})$', 'Hex colour'],
    ['^\\d{4}-\\d{2}-\\d{2}$', 'ISO date'],
    ['(?<year>\\d{4})-(?<month>\\d{2})', 'Named groups']
  ];

  DevBox.register({
    id: 'regex',
    icon: '.*',
    category: 'text',
    keywords: 'regex regexp regular expression test match replace pattern groups capture',
    name: { en: 'Regex Tester', uz: 'Regex sinovchi', ru: 'Тестер регулярок' },
    desc: {
      en: 'Test a pattern against sample text as you type, inspect every capture group, and preview a replacement.',
      uz: 'Naqshni matn ustida jonli sinang, har bir guruhni koʻring va almashtirish natijasini oldindan koʻring.',
      ru: 'Проверяйте шаблон на тексте в реальном времени, разбирайте группы и смотрите результат замены.'
    },

    mount: function (root, ctx) {
      var pattern = ui.input({ placeholder: '\\b\\w+@\\w+\\.\\w+\\b', value: ctx.store.get('pattern', '\\b[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}\\b') });

      var flagBoxes = {};
      var flagRow = h('div.row.tight');
      [['g', 'global'], ['i', 'ignore case'], ['m', 'multiline ^$'], ['s', 'dot matches newline'], ['u', 'unicode'], ['y', 'sticky']].forEach(function (pair) {
        var saved = ctx.store.get('flag_' + pair[0], pair[0] === 'g' || pair[0] === 'm');
        var box = ui.checkbox(pair[0] + ' — ' + pair[1], saved, function () {
          ctx.store.set('flag_' + pair[0], box.checked);
          run();
        });
        flagBoxes[pair[0]] = box;
        flagRow.appendChild(box);
      });

      var subject = ui.textarea({
        tall: true,
        value: ctx.store.get('subject', 'Contact ada@example.com or team@shashka.dev.\nInvalid: nope@nope\nAlso reach salom@misol.uz today.')
      });

      var replacement = ui.input({ placeholder: '<$&>  or  $1', value: ctx.store.get('replacement', '') });

      var status = h('div');
      var highlighted = h('div.out.hl');
      var groupsHost = h('div');
      var replaceOut = ui.output({ title: 'After replacement' });

      var samples = h('div.row.tight.mt12');
      SAMPLES.forEach(function (sample) {
        samples.appendChild(ui.chip(sample[1], function () { pattern.value = sample[0]; run(); }));
      });

      function flags() {
        return Object.keys(flagBoxes).filter(function (f) { return flagBoxes[f].checked; }).join('');
      }

      function run() {
        ctx.store.set('pattern', pattern.value.slice(0, 2000));
        ctx.store.set('subject', subject.value.slice(0, 50000));
        ctx.store.set('replacement', replacement.value.slice(0, 500));

        ui.clear(status);
        ui.clear(groupsHost);
        ui.clear(highlighted);

        if (!pattern.value) {
          highlighted.textContent = subject.value;
          replaceOut.set('');
          return;
        }

        var re;
        try {
          re = new RegExp(pattern.value, flags());
        } catch (err) {
          status.appendChild(ui.banner('err', err.message));
          highlighted.textContent = subject.value;
          replaceOut.set('');
          return;
        }

        var matches = collect(re, subject.value);
        status.appendChild(matches.length
          ? ui.banner('ok', matches.length + ' match' + (matches.length === 1 ? '' : 'es') + ' found.')
          : ui.banner('warn', 'No matches.'));

        highlighted.appendChild(highlight(subject.value, matches));

        if (matches.length) groupsHost.appendChild(groupTable(matches));

        try {
          replaceOut.set(subject.value.replace(re, replacement.value));
        } catch (err) {
          replaceOut.set(err.message, 'err');
        }
      }

      function groupTable(matches) {
        var groupCount = matches.reduce(function (max, m) { return Math.max(max, m.groups.length); }, 0);
        var names = matches[0].names || [];

        var head = [h('th', '#'), h('th', 'Match'), h('th', 'Index')];
        for (var g = 1; g <= groupCount; g++) head.push(h('th', names[g - 1] ? '$' + g + ' ' + names[g - 1] : '$' + g));

        var body = matches.slice(0, 300).map(function (m, i) {
          var cells = [
            h('td', { text: String(i + 1) }),
            h('td.mono', { text: m.text === '' ? '(empty)' : m.text }),
            h('td.mono', { text: String(m.index) })
          ];
          for (var g2 = 0; g2 < groupCount; g2++) {
            cells.push(h('td.mono', { text: m.groups[g2] === undefined ? '—' : m.groups[g2] }));
          }
          return h('tr', cells);
        });

        var card = ui.card('Matches', h('div.tbl-scroll', h('table.tbl', h('thead', h('tr', head)), h('tbody', body))));
        card.body.classList.add('flush');
        card.actions.appendChild(h('button.btn.sm.ghost', {
          type: 'button',
          onclick: function () { ui.copy(matches.map(function (m) { return m.text; }).join('\n')); }
        }, 'Copy all matches'));
        return card;
      }

      root.appendChild(ui.card('Pattern', pattern, h('div.mt12', flagRow), samples));
      root.appendChild(ui.card('Test against', subject));
      root.appendChild(status);
      root.appendChild(ui.card('Highlighted', highlighted));
      root.appendChild(groupsHost);
      root.appendChild(ui.card('Replace with', replacement,
        h('div.note.mt8', { text: 'Use $& for the whole match, $1 for the first group, $<name> for a named group, and $$ for a literal dollar sign.' })));
      root.appendChild(replaceOut);

      var cheatTable = h('table.tbl', h('tbody', CHEATS.map(function (row) {
        return h('tr', h('td.mono', { text: row[0] }), h('td', { text: row[1] }));
      })));
      var cheatCard = ui.card('Cheat sheet', h('div.tbl-scroll', cheatTable));
      cheatCard.body.classList.add('flush');
      root.appendChild(cheatCard);

      pattern.control.addEventListener('input', ui.debounce(run, 250));
      subject.addEventListener('input', ui.debounce(run, 250));
      replacement.control.addEventListener('input', ui.debounce(run, 250));
      run();
    }
  });

  /** Collects matches with a guard against zero-length-match infinite loops. */
  function collect(re, text) {
    var out = [];
    if (!re.global && !re.sticky) {
      var single = re.exec(text);
      if (single) out.push(toMatch(single));
      return out;
    }

    re.lastIndex = 0;
    var m, guard = 0;
    while ((m = re.exec(text)) !== null) {
      out.push(toMatch(m));
      if (m[0] === '') re.lastIndex++;
      if (++guard > 20000) break;
    }
    return out;
  }

  function toMatch(m) {
    return {
      text: m[0],
      index: m.index,
      groups: m.slice(1),
      names: m.groups ? Object.keys(m.groups) : []
    };
  }

  function highlight(text, matches) {
    var frag = document.createDocumentFragment();
    var last = 0;
    matches.forEach(function (m) {
      if (m.index < last) return;   // overlapping results cannot be drawn twice
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var mark = h('mark', { text: m.text === '' ? String.fromCharCode(0x200B) : m.text });
      if (m.text === '') mark.classList.add('empty-match');
      frag.appendChild(mark);
      last = m.index + m.text.length;
    });
    frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
})();

/* Identifier and prose case conversion. */
(function () {
  'use strict';
  var ui = DevBox.ui, h = ui.h;

  // Small words that stay lowercase inside a title, unless they lead it.
  var MINOR = ['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'in', 'nor', 'of', 'on', 'or', 'per', 'so', 'the', 'to', 'up', 'via', 'vs', 'yet'];

  var CASES = [
    ['camelCase', function (w) { return w.map(function (x, i) { return i ? cap(x) : x; }).join(''); }],
    ['PascalCase', function (w) { return w.map(cap).join(''); }],
    ['snake_case', function (w) { return w.join('_'); }],
    ['SCREAMING_SNAKE', function (w) { return w.join('_').toUpperCase(); }],
    ['kebab-case', function (w) { return w.join('-'); }],
    ['COBOL-CASE', function (w) { return w.join('-').toUpperCase(); }],
    ['Train-Case', function (w) { return w.map(cap).join('-'); }],
    ['dot.case', function (w) { return w.join('.'); }],
    ['path/case', function (w) { return w.join('/'); }],
    ['Sentence case', function (w) { return cap(w.join(' ')); }],
    ['Title Case', function (w) {
      return w.map(function (word, i) {
        return (i > 0 && i < w.length - 1 && MINOR.indexOf(word) >= 0) ? word : cap(word);
      }).join(' ');
    }],
    ['lower case', function (w) { return w.join(' '); }],
    ['UPPER CASE', function (w) { return w.join(' ').toUpperCase(); }]
  ];

  DevBox.register({
    id: 'case',
    icon: 'Aa',
    category: 'text',
    keywords: 'case camel pascal snake kebab title upper lower convert naming identifier slug',
    name: { en: 'Case Converter', uz: 'Registr oʻzgartirgich', ru: 'Конвертер регистра' },
    desc: {
      en: 'Rewrite names into camelCase, snake_case, kebab-case, Title Case and nine other conventions at once.',
      uz: 'Nomlarni camelCase, snake_case, kebab-case, Title Case va yana toʻqqizta uslubga bir vaqtda oʻgiradi.',
      ru: 'Преобразование имён в camelCase, snake_case, kebab-case, Title Case и ещё девять вариантов сразу.'
    },

    mount: function (root, ctx) {
      var input = ui.textarea({ short: true, value: ctx.store.get('input', 'getUserProfileByID'), placeholder: 'user profile name' });
      var perLine = ui.checkbox('Convert each line separately', ctx.store.get('perLine', false), run);
      var results = h('div');

      function run() {
        ctx.store.set('input', input.value.slice(0, 20000));
        ctx.store.set('perLine', perLine.checked);
        ui.clear(results);

        var text = input.value;
        if (!text.trim()) return;

        var list = h('dl.kv');
        CASES.forEach(function (entry) {
          var value = perLine.checked
            ? text.split('\n').map(function (line) { return line.trim() ? entry[1](split(line)) : ''; }).join('\n')
            : entry[1](split(text));

          list.appendChild(h('dt', { text: entry[0] }));
          var dd = h('dd', { text: value });
          dd.style.cursor = 'pointer';
          dd.title = 'Click to copy';
          dd.addEventListener('click', function () { ui.copy(value); });
          list.appendChild(dd);
        });
        results.appendChild(list);
      }

      root.appendChild(ui.card('Input', input, h('div.row.mt12', perLine)));
      root.appendChild(ui.card('Every case at once', results));
      root.appendChild(h('div.note', { text: 'Click any result to copy it. Acronyms are split on the case boundary, so “parseHTTPResponse” becomes “parse http response”.' }));

      input.addEventListener('input', ui.debounce(run, 200));
      run();
    }
  });

  /**
   * Splits an identifier into lowercase words. Handles camelCase boundaries,
   * runs of capitals (HTTPServer → http server), digits and any separator.
   */
  function split(text) {
    return String(text)
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
      .replace(/([a-zA-Z])(\d)/g, '$1 $2')
      .replace(/(\d)([a-zA-Z])/g, '$1 $2')
      .split(/[^a-zA-Z0-9]+/)
      .filter(Boolean)
      .map(function (word) { return word.toLowerCase(); });
  }

  function cap(word) { return word.charAt(0).toUpperCase() + word.slice(1); }
})();
