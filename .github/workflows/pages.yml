name: Deploy to GitHub Pages

# Publishes a live demo at https://nasafuriy.github.io/offline-devtools/
# Enable it once under Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.mjs

      - name: Render the icons and social preview
        run: node build-assets.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.webmanifest _site/
          cp sw.js _site/
          cp -r src _site/
          cp -r docs _site/
          mkdir -p _site/dist
          cp dist/shashka.html _site/dist/
          # Offer the single file as a direct download from the site root too.
          cp dist/shashka.html _site/shashka.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
